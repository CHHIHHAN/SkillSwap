<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>会了吗</title>
<meta name="description" content="会了吗：用你会的，换你想学的。技能互换平台原型。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%2216%2016%2088%2088%22%3E%3Cpath%20d%3D%22M16%2030a14%2014%200%200%201%2014-14h30v88H30a14%2014%200%200%201-14-14z%22%20fill%3D%22%231CB0F6%22/%3E%3Cpath%20d%3D%22M60%2016h30a14%2014%200%200%201%2014%2014v60a14%2014%200%200%201-14%2014H60z%22%20fill%3D%22%23FF9600%22/%3E%3Cpath%20d%3D%22M60%2019v82%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.5%22%20stroke-dasharray%3D%225%206%22/%3E%3Ccircle%20cx%3D%2241%22%20cy%3D%2252%22%20r%3D%2213%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2279%22%20cy%3D%2252%22%20r%3D%2213%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2254%22%20r%3D%226.5%22%20fill%3D%22%233C3C3C%22/%3E%3Ccircle%20cx%3D%2281%22%20cy%3D%2254%22%20r%3D%226.5%22%20fill%3D%22%233C3C3C%22/%3E%3Cpath%20d%3D%22M48%2076q12%2012%2024%200%22%20stroke%3D%22%233C3C3C%22%20stroke-width%3D%225%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%2216%2016%2088%2088%22%3E%3Cpath%20d%3D%22M16%2030a14%2014%200%200%201%2014-14h30v88H30a14%2014%200%200%201-14-14z%22%20fill%3D%22%231CB0F6%22/%3E%3Cpath%20d%3D%22M60%2016h30a14%2014%200%200%201%2014%2014v60a14%2014%200%200%201-14%2014H60z%22%20fill%3D%22%23FF9600%22/%3E%3Cpath%20d%3D%22M60%2019v82%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223.5%22%20stroke-dasharray%3D%225%206%22/%3E%3Ccircle%20cx%3D%2241%22%20cy%3D%2252%22%20r%3D%2213%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2279%22%20cy%3D%2252%22%20r%3D%2213%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2254%22%20r%3D%226.5%22%20fill%3D%22%233C3C3C%22/%3E%3Ccircle%20cx%3D%2281%22%20cy%3D%2254%22%20r%3D%226.5%22%20fill%3D%22%233C3C3C%22/%3E%3Cpath%20d%3D%22M48%2076q12%2012%2024%200%22%20stroke%3D%22%233C3C3C%22%20stroke-width%3D%225%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
/* Layout: 左侧导航 | 主内容 | 右侧成就栏；手机端导航变成底部 Tab。风格：明亮、圆角、按钮有"厚底"可按压感 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#3C3C3C; --muted:#777777; --line:#E5E5E5; --soft:#F7F7F7;
  --green:#58CC02; --green-d:#58A700; --green-s:#D7FFB8;
  --blue:#1CB0F6; --blue-d:#1899D6; --blue-s:#DDF4FF;
  --orange:#FF9600; --orange-d:#CD7900; --orange-s:#FFF0D9;
  --gold:#FFC800; --gold-d:#E0A800; --red:#FF4B4B; --red-d:#EA2B2B; --purple:#CE82FF;
  --font:"Nunito","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131F24; --surface:#131F24; --ink:#F1F7FB; --muted:#9BA7AD; --line:#37464F; --soft:#1C2B33;
  --green-s:#1F3A12; --blue-s:#0E3247; --orange-s:#3D2A0E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131F24; --surface:#131F24; --ink:#F1F7FB; --muted:#9BA7AD; --line:#37464F; --soft:#1C2B33;
  --green-s:#1F3A12; --blue-s:#0E3247; --orange-s:#3D2A0E; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;font-weight:700}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance;font-weight:900}
h1{font-size:clamp(22px,3.4vw,30px)}
h2{font-size:21px}
h3{font-size:17px}
a{color:var(--blue)}
p{margin:0}
.muted{color:var(--muted);font-weight:500}
.small{font-size:14px}

/* ---------- 外框 ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr) 330px;min-height:100vh}
.side{border-right:2px solid var(--line);padding:24px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px}
.logo{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:900;color:var(--green);text-decoration:none;padding:0 12px;letter-spacing:.02em}
.logoicon{width:40px;height:40px;flex:none}
.mobilebar .logoicon{width:32px;height:32px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;border:2px solid transparent;text-decoration:none;color:var(--muted);font-weight:900;font-size:15px;letter-spacing:.04em}
.nav a svg{width:30px;height:30px;flex:none}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--blue-s);border-color:#84D8FF;color:var(--blue)}
.main{padding:28px 32px 96px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));min-width:0}
.mainin{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.rail{padding:24px 24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.stats{display:flex;gap:6px;justify-content:space-between}
.stat{display:flex;align-items:center;gap:6px;font-weight:900;padding:6px 10px;border-radius:12px;font-size:16px}
.stat svg{width:26px;height:26px}
.statwrap{position:relative;display:inline-flex}
.pop{position:absolute;top:calc(100% + 10px);z-index:30;width:250px;max-width:calc(100vw - 32px);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;box-shadow:0 4px 0 var(--line);text-align:left}
.pop::before{content:"";position:absolute;top:-9px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}
.pop b{font-weight:900;display:block;margin-bottom:6px}
.prow{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:2px solid var(--line);font-weight:700;line-height:1.4}
.pic svg{width:24px;height:24px;display:block}
.pd{font-weight:900;font-size:13px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.pd.up{background:var(--green-s);color:var(--green-d)}.pd.down{background:#FFDFE0;color:var(--red-d)}
.pl .pop{left:0}.pl .pop::before{left:18px}
.pr .pop{right:0}.pr .pop::before{right:18px}
.mobilebar .pl .pop{left:auto;right:-60px}.mobilebar .pl .pop::before{left:auto;right:78px}
.rail{overflow:visible}
button.stat{font:inherit;font-weight:900;background:none;border:2px solid transparent;cursor:pointer}
button.stat:hover{background:var(--blue-s);border-color:#84D8FF}
.coinhead{display:flex;align-items:center;gap:14px}
.coinhead .big{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:900;color:var(--blue)}
.coinhead .big svg{width:40px;height:40px}
.shopentry{font:inherit;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;background:var(--blue-s);border:2px solid #84D8FF;border-bottom-width:5px;border-radius:16px;padding:12px 14px;color:var(--ink)}
.shopentry .pic svg{width:36px;height:36px}
.shopentry b{display:block;font-weight:900;font-size:16px}
.packs{display:flex;flex-direction:column;gap:10px}
.pack{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px}

.pack.used{opacity:.55}
.pcoins{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:16px;white-space:nowrap}
.pcoins svg{width:28px;height:28px;flex:none}
.pinfo{min-width:0}
.pname{font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pd.new{background:var(--orange-s);color:var(--orange-d)}
.pack .btn{min-width:84px}
.ways{display:flex;flex-direction:column;gap:12px}
.way{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px}
.way .tag{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.way .txt{min-width:0}
.way .txt p{font-size:14px;margin-top:2px}
.way .act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat.fire{color:var(--orange)} .stat.gem{color:var(--blue)} .stat.heart{color:var(--red)}
.mobilebar{display:none}

/* ---------- 卡片与按钮 ---------- */
.box{border:2px solid var(--line);border-radius:16px;padding:18px;background:var(--surface)}
.box h3{margin-bottom:10px}
.btn{font:inherit;font-weight:900;font-size:15px;letter-spacing:.06em;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s,box-shadow .05s;text-transform:uppercase;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.orange{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.btn.ghost{background:var(--surface);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:10px 16px}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.ghost.sm{padding:6px 12px}
.btn.ghost.learnbtn{color:var(--orange)}
.btn.wide{width:100%}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:4px 12px;border-radius:12px;font-weight:800;white-space:nowrap;border:2px solid transparent}
.chip.t{background:var(--blue-s);color:var(--blue-d)}
.chip.l{background:var(--orange-s);color:var(--orange-d)}
.chip.g{background:var(--green-s);color:var(--green-d)}
.chip.n{background:var(--soft);color:var(--muted);border-color:var(--line)}
.chip.hit{border-color:currentColor}
:root:not([data-theme="light"]) .chip.t,:root:not([data-theme="light"]) .chip.l,:root:not([data-theme="light"]) .chip.g{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.t{color:var(--blue)}:root:not([data-theme="light"]) .chip.l{color:var(--orange)}:root:not([data-theme="light"]) .chip.g{color:var(--green)}}
:root[data-theme="dark"] .chip.t{color:var(--blue)}:root[data-theme="dark"] .chip.l{color:var(--orange)}:root[data-theme="dark"] .chip.g{color:var(--green)}
.chip.pick{font:inherit;font-size:14px;font-weight:800;cursor:pointer;border-bottom-width:4px;border-color:currentColor;transition:transform .05s}
.chip.pick:active{transform:translateY(2px)}
.chip.pick.off{background:transparent!important;color:var(--muted)!important;border-style:dashed;border-color:var(--line);border-bottom-width:2px;text-decoration:line-through}
.chip button{background:none;border:0;color:inherit;font:inherit;padding:0 0 0 4px;cursor:pointer;font-size:16px;line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- 吉祥物气泡 ---------- */
.hello{display:flex;gap:16px;align-items:center}
.hello svg{flex:none;width:96px;height:96px}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px 18px;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble p{margin-top:4px}
@media (prefers-reduced-motion:no-preference){.mascot{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}

/* ---------- 技能卡（我能教 / 我想学）---------- */
.myskills{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.half{border-radius:16px;padding:16px;border:2px solid;border-bottom-width:5px;min-width:0}
.half.t{border-color:var(--blue);background:var(--blue-s)}
.half.l{border-color:var(--orange);background:var(--orange-s)}
.half .lab{font-size:13px;letter-spacing:.1em;font-weight:900}
.half.t .lab{color:var(--blue-d)} .half.l .lab{color:var(--orange-d)}
.half .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.half .chip{background:var(--surface)}

/* ---------- 筛选 ---------- */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:900;font-size:14px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-s)}

/* ---------- 用户卡 ---------- */
.list{display:flex;flex-direction:column;gap:14px}
.ucard{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ucard.mutual{border-color:var(--green)}
.uhead{display:flex;gap:12px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:20px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.uname{font-weight:900;font-size:17px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta{font-size:13px;color:var(--muted);font-weight:700}
.ring{margin-left:auto;position:relative;width:58px;height:58px;flex:none}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:900}
.kv{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start;font-size:14px}
.kv>span{color:var(--muted);padding-top:4px}
.kv>div{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.why{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.why b{color:var(--ink);font-weight:900}
.ufoot{display:flex;gap:10px;align-items:center}
.ufoot .meta{margin-right:auto}

/* ---------- 环形交换 ---------- */
.loop{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.loop .node{font-weight:900;padding:6px 12px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface)}
.loop .node.me{border-color:var(--green);color:var(--green-d)}
.loop .arr{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);line-height:1.1}
.loop .arr em{font-style:normal;color:var(--blue);font-weight:900}
.more{display:inline-block;margin-top:14px;font-weight:900;font-size:14px;color:var(--blue);text-decoration:none;letter-spacing:.04em}
.more:hover{text-decoration:underline}
.trioseg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.trioseg button{font:inherit;font-weight:900;font-size:13px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--muted);cursor:pointer}
.trioseg button.on{border-color:var(--green);color:var(--green-d);background:var(--green-s)}
.loop .node.slot{border-style:dashed;color:var(--muted)}
.team.nofit .loop{opacity:.6}
.cyc{display:flex;flex-direction:column;gap:12px}
.cycrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:2px solid var(--line)}
.cycrow:first-child{border-top:0;padding-top:0}

/* ---------- 表单 ---------- */
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:900}
input,select,textarea{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none}
.addrow{display:flex;gap:8px}
.addrow input{flex:2;min-width:0}.addrow select{flex:1;min-width:0}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{font:inherit;font-weight:800;font-size:14px;padding:6px 12px;border-radius:12px;border:2px dashed var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.suggest button:hover{border-color:var(--blue);color:var(--blue)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- 交换 ---------- */
.swap{display:flex;flex-direction:column;gap:12px}
.bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px;position:relative;transition:width .4s}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.status{font-size:12px;font-weight:900;padding:2px 8px;border-radius:8px;letter-spacing:.04em}
.st-pending{background:var(--orange-s);color:var(--orange-d)}
.st-active{background:var(--blue-s);color:var(--blue-d)}
.st-done{background:var(--green-s);color:var(--green-d)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 6px;border-bottom:2px solid var(--line);text-align:left}
th{color:var(--muted);font-size:12px;letter-spacing:.08em}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:900}
.tblwrap{overflow-x:auto}
.stars{display:flex;gap:2px}
.stars button{background:none;border:0;cursor:pointer;color:var(--gold);font-size:26px;padding:0 2px;line-height:1}
.empty{text-align:center;padding:28px 16px;border:2px dashed var(--line);border-radius:16px;color:var(--muted)}
.empty svg{width:90px;height:90px;margin-bottom:8px}

/* ---------- 右侧栏 ---------- */

.goal .bar{margin-top:10px}
.hotm{display:none}
@media (max-width:960px){.hotm{display:block}}
.hot{display:flex;flex-direction:column;gap:2px}
.hot>div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:12px}
.hot>div:hover{background:var(--soft)}
.hot .rk{font-weight:900;color:var(--muted);text-align:center}
.hot .rk.top{color:var(--orange)}
.hot b{font-weight:900}
.lb{display:flex;flex-direction:column;gap:2px}
.lb div{display:grid;grid-template-columns:24px 36px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:12px;font-size:14px}
.lb div.me{background:var(--green-s)}
.lb .ava{width:32px;height:32px;font-size:13px;box-shadow:none}
.lb .rk{font-weight:900;color:var(--muted);text-align:center}
.lb .rk.top{color:var(--gold-d)}

/* ---------- 产品说明 ---------- */
.pain{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pain .box p{margin-top:6px;font-size:14px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;padding-bottom:18px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:23px;top:48px;bottom:0;width:4px;background:var(--line);border-radius:2px}
.step .dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.step p{font-size:14px;margin-top:2px}
.mech{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mech p{font-size:14px;margin-top:6px}
.mech code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 6px;border-radius:6px;color:var(--ink)}

/* ---------- 弹窗 / 提示 ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border:2px solid var(--line);border-radius:20px;max-width:500px;width:100%;padding:22px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.notebox{background:var(--green-s);color:var(--green-d);border-radius:12px;padding:10px 12px;font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .notebox{color:var(--green)}}
:root[data-theme="dark"] .notebox{color:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--green-s);color:var(--green-d);border:2px solid var(--green);padding:12px 18px;border-radius:16px;font-weight:900;max-width:calc(100% - 32px);box-shadow:0 4px 0 var(--green-d)}
.toast.bad{background:#FFDFE0;color:var(--red-d);border-color:var(--red);box-shadow:0 4px 0 var(--red-d)}
.foot{font-size:13px;color:var(--muted);font-weight:500}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
  .shell{grid-template-columns:96px minmax(0,1fr) 300px}
  .side .logo span,.nav a span{display:none}
  .nav a{justify-content:center;padding:10px}
  .logo{justify-content:center;padding:0}
}
@media (max-width:960px){
  .shell{grid-template-columns:96px minmax(0,1fr)}
  .rail{display:none}
  .mobilebar{display:flex;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;align-items:center}
  .mobilebar .logo{font-size:22px}
  .mobilebar .stats{gap:2px}
  .mobilebar .stat{padding:4px 6px;font-size:15px}
  .mobilebar .stat svg{width:22px;height:22px}
  .side .logo{display:none}
}
@media (max-width:640px){
  .shell{display:block}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));border-right:0;border-top:2px solid var(--line);background:var(--surface);z-index:20}
  .nav{flex-direction:row;justify-content:space-around;width:100%}

  .myskills,.form2,.pain,.mech{grid-template-columns:1fr}
  .hello svg{width:72px;height:72px}
}

/* ---------- 匹配算法 ---------- */
function match(u){
  const canLearn=u.teach.map(t=>t.s).filter(s=>actWant().includes(s));
  const canTeach=actTeach().filter(s=>u.want.includes(s));
  let score=0;
  if(canLearn.length) score+=45;
  if(canTeach.length) score+=35;
  if(canLearn.length&&canTeach.length) score+=10;
  if(u.city===me.city||(u.mode.includes('线上')&&me.mode.includes('线上'))) score+=5;
  if(u.time===me.time) score+=3;
  score+=Math.round((u.rate-4.5)*4);
  const type=canLearn.length&&canTeach.length?'mutual':canLearn.length?'learn':canTeach.length?'teach':'none';
  return {u,canLearn,canTeach,score:Math.max(0,Math.min(99,score)),type};
}
function cycles(){
  const out=[];
  for(const a of users){const meToA=actTeach().filter(s=>a.want.includes(s));if(!meToA.length)continue;

      const bToMe=b.teach.map(t=>t.s).filter(s=>actWant().includes(s));
      if(aToB.length&&bToMe.length) out.push({a,b,meToA:meToA[0],aToB:aToB[0],bToMe:bToMe[0]});}}

window.addHotT=sk=>{if(!myTeach().includes(sk))me.teach.push({s:sk,lv:'熟练'});persist();const n=users.filter(u=>u.want.includes(sk)).length;
  filter='teach';toast(n?`已加入能教，${n} 位用户想跟你学${sk}`:`已加入能教「${sk}」`);if(location.hash==='#discover'||!location.hash){vDiscover();renderRail()}else location.hash='discover'};
window.rmHotT=sk=>{me.teach=me.teach.filter(x=>x.s!==sk);me.offT=offT().filter(x=>x!==sk);persist();toast(`已把「${sk}」移出能教`);
  renderRail();const h=(location.hash||'#discover').slice(1);({discover:vDiscover,trio:vTrio,post:vPost}[h]||(()=>{}))()};
window.rmHot=sk=>{me.want=me.want.filter(x=>x!==sk);me.offW=offW().filter(x=>x!==sk);persist();toast(`已把「${sk}」移出想学`);
  renderRail();const h=(location.hash||'#discover').slice(1);({discover:vDiscover,trio:vTrio,post:vPost}[h]||(()=>{}))()};
window.addHot=sk=>{if(!me.want.includes(sk))me.want.push(sk);persist();const n=users.filter(u=>u.teach.some(t=>t.s===sk)).length;
  filter='learn';toast(n?`已加入想学，找到 ${n} 位能教你${sk}的人`:`已加入想学「${sk}」`);if(location.hash==='#discover'||!location.hash){vDiscover();renderRail()}else location.hash='discover'};

/* ---------- 时间币说明 ---------- */
window.openCoin=()=>{
  const all=users.map(match),c=t=>all.filter(m=>m.type===t).length,bal=coins();
  const ways=[
   ['teach','赚','#58CC02','green','赚时间币：教别人','TA 想学你会的技能。你每教 1 小时，赚 1 个时间币。',`${c('teach')} 人想跟你学`,'去教别人'],
   ['mutual','免','#1CB0F6','blue','免时间币：技能互换','你教 TA 一项，TA 教你一项。互不付费，时间币不变。',`${c('mutual')} 人可以和你互换`,'去互换'],
   ['learn','花','#FF9600','orange','花时间币：向别人学','TA 会你想学的，但不想学你的技能。每学 1 小时，花 1 个时间币。',`${c('learn')} 人可以教你`,'去学习']
  ];
  layer.innerHTML=`<div class="scrim" onclick="if(event.target===this)closeL()"><div class="modal" role="dialog" aria-label="时间币">
   <div class="coinhead"><div class="big">${ICON.gem}${bal}</div><div><h2>时间币</h2><p class="muted small">所有技能的 1 小时都等价：教 1 小时 = 学 1 小时 = 1 币</p></div></div>
   ${bal<1?`<div class="toast bad" style="position:static;transform:none;box-shadow:none;max-width:none">时间币用完了，先教别人一节课赚一点，或者找人互换。</div>`:''}
   <button class="shopentry" onclick="openShop()"><span class="pic">${ICON.gem}</span><span><b>购买时间币</b><span class="meta">没空教课？直接买，低至 ¥9.99</span></span><span class="pd up">新人特惠</span></button>
   <div class="ways">${ways.map(w=>`<div class="way"><div class="tag" style="background:${w[2]}">${w[1]}</div>
     <div class="txt"><h3>${w[4]}</h3><p class="muted">${w[5]}</p></div>
     <div class="act"><span class="meta">${w[6]}</span><button class="btn sm ${w[3]==='green'?'':w[3]}" ${w[0]==='learn'&&bal<1?'disabled title="时间币不足"':''} onclick="goFilter('${w[0]}')">${w[7]}</button></div></div>`).join('')}</div>
   <p class="foot">新用户送 2 个时间币。三人行也不花时间币。</p>
   <button class="btn ghost" onclick="closeL()">知道了</button>
  </div></div>`;
};
const PACKS=[{id:'new',name:'新人礼包',coins:1,price:9.99,tag:'限购 1 次',save:'省 80%'},{id:'base',name:'基础',coins:1,price:50},{id:'small',name:'小包',coins:3,price:130,save:'省 13%'},{id:'big',name:'大包',coins:9,price:360,save:'省 20%',hot:1}];
let newbieUsed=load('newbie',false);
window.openShop=()=>{
  layer.innerHTML=`<div class="scrim" onclick="if(event.target===this)closeL()"><div class="modal" role="dialog" aria-label="购买时间币">
   <div class="row" style="justify-content:space-between"><h2>购买时间币</h2><button class="btn ghost sm" onclick="openCoin()">← 返回</button></div>
   <p class="muted small">1 个时间币 = 向任何人学 1 小时。当前余额 ${coins()} 个。</p>
   <div class="packs">${PACKS.map(p=>{const off=p.id==='new'&&newbieUsed;const per=(p.price/p.coins).toFixed(p.price%p.coins?1:0);
    return `<div class="pack${off?' used':''}"><div class="pcoins">${ICON.gem}<b>×${p.coins}</b></div>
     <div class="pinfo"><div class="pname">${p.name}${p.hot?'<span class="pd up">最划算</span>':''}${p.id==='new'?'<span class="pd new">新人</span>':''}</div>
     <div class="meta">${p.id==='new'?'原价 ¥50':p.coins>1?`约 ¥${per}/个`:'¥50/个'}${p.save?` · ${p.save}`:''}${p.tag?` · ${p.tag}`:''}</div></div>
     <button class="btn sm ${p.id==='new'?'orange':''}" ${off?'disabled':''} onclick="buyPack('${p.id}')">${off?'已领取':'¥'+p.price}</button></div>`}).join('')}</div>
   <p class="foot">原型演示：点击购买会直接到账，不会真实扣款。</p></div></div>`};
window.buyPack=id=>{const p=PACKS.find(x=>x.id===id);if(id==='new'){if(newbieUsed)return;newbieUsed=true;save('newbie',true)}
  ledger.push({t:`购买${p.name}（¥${p.price}）`,d:p.coins,ts:Date.now()});save('ledger',ledger);renderRail();
  if(location.hash==='#swaps')vSwaps();toast(`已到账 ${p.coins} 个时间币`);openShop()};
window.goFilter=k=>{filter=k;closeL();if(location.hash==='#discover'||!location.hash)vDiscover();else location.hash='discover';window.scrollTo(0,0)};

/* ---------- 我的交换 ---------- */
function vSwaps(){
  const groups=[['active','进行中'],['pending','等待确认'],['done','已完成']];
  app.innerHTML=`
  <div class="hello">${mascot()}<div class="bubble"><h1>今天的课上了吗？</h1><p class="muted">每上完一节课双方打卡，时间币自动结算，连续学习天数 +1。</p></div></div>
  ${swaps.length?groups.map(([k,l])=>{const arr=swaps.filter(s=>s.status===k);return arr.length?`<h2>${l} · ${arr.length}</h2><div class="list">${arr.map(swapRow).join('')}</div>`:''}).join('')
   :`<div class="empty">${mascot('sad')}<p>还没有交换。去 <a href="#discover">发现匹配</a> 约第一节试听吧。</p></div>`}
  <div class="box"><div class="row" style="justify-content:space-between"><h3 style="margin:0">时间币明细</h3><button class="stat gem" title="点击查看如何赚取" onclick="openCoin()">${ICON.gem}${coins()}</button></div>
  <div class="tblwrap"><table><thead><tr><th>事项</th><th>时间</th><th class="num">变动</th></tr></thead><tbody>
  ${ledger.slice().reverse().map(r=>`<tr><td>${esc(r.t)}</td><td class="meta">${new Date(r.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td class="num" style="color:${r.d>0?'var(--green)':r.d<0?'var(--red)':'var(--muted)'}">${r.d>0?'+':''}${r.d}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function swapRow(s){
  const u=byId(s.uid);
  const kind=s.cycle?'三人行':s.teach&&s.learn?'互教互学':s.learn?'向 TA 学':'TA 跟我学';
  const st={pending:['st-pending','等待确认'],active:['st-active','进行中'],done:['st-done','已完成']}[s.status];
  let act='';
  if(s.status==='pending') act=`<button class="btn sm" onclick="accept(${s.id})">模拟对方同意</button><button class="btn ghost sm" onclick="cancelS(${s.id})">撤回</button>`;
  if(s.status==='active') act=`<button class="btn sm" onclick="checkin(${s.id})">完成一节课</button>`;
  if(s.status==='done') act=s.rated?`<span class="meta">你的评价 ${'★'.repeat(s.rated)}</span>`:`<span class="meta">给 TA 打分</span><span class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${n} 星" onclick="rate(${s.id},${n})">☆</button>`).join('')}</span>`;
  return `<div class="ucard swap"><div class="uhead">${ava(u)}<div style="min-width:0"><div class="uname">${esc(u.name)} <span class="status ${st[0]}">${st[1]}</span> <span class="chip n">${kind}</span></div>
   <div class="meta">${s.cycle?esc(s.cycle):`${s.learn?'我学 '+esc(s.learn):''}${s.teach&&s.learn?' · ':''}${s.teach?'我教 '+esc(s.teach):''}`} · ${esc(s.mode)}</div></div></div>
   <div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${s.done/s.n*100}%"></i></div><span class="meta">${s.done}/${s.n}</span></div>
   <div class="row" style="justify-content:flex-end">${act}</div></div>`;
}
window.accept=id=>{const s=swaps.find(x=>x.id===id);s.status='active';save('swaps',swaps);toast(byId(s.uid).name+' 同意了，可以开始上课');vSwaps()};
window.cancelS=id=>{swaps=swaps.filter(x=>x.id!==id);save('swaps',swaps);vSwaps()};
window.checkin=id=>{const s=swaps.find(x=>x.id===id),u=byId(s.uid),ts=Date.now();
  if(s.learn&&!s.teach&&!s.cycle){if(coins()<1){toast('时间币不够了，先教别人一节课赚一点吧',true);openCoin();return}ledger.push({t:`向 ${u.name} 学 ${s.learn}`,d:-1,ts,lesson:1})}
  else if(s.teach&&!s.learn){ledger.push({t:`教 ${u.name} ${s.teach}`,d:1,ts,lesson:1,taught:1})}
  else{ledger.push({t:s.cycle?`三人行：学 ${s.learn}`:`和 ${u.name} 互换 ${s.learn} / ${s.teach}`,d:0,ts,lesson:1,taught:1})}
  const today=dayKey(ts),yest=dayKey(ts-864e5);
  if(streak.last!==today){streak.n=streak.last===yest?streak.n+1:1;streak.last=today}
  s.done++;
  if(s.done>=s.n){s.status='done';toast('全部课时完成！给对方打个分吧')}else toast(`第 ${s.done} 节完成，连续学习 ${streak.n} 天`);
  save('swaps',swaps);save('ledger',ledger);save('streak',streak);renderRail();vSwaps()};
window.rate=(id,n)=>{const s=swaps.find(x=>x.id===id);s.rated=n;save('swaps',swaps);toast('谢谢你的评价');vSwaps()};

/* ---------- 产品设计 ---------- */
function vAbout(){
  const steps=[['填写技能卡','能教什么、熟练度、想学什么、空闲时间','#1CB0F6'],['系统匹配','互教互学、单向学习、三人行','#FF9600'],['免费试听','第一节课前 15 分钟，不合适随时结束','#CE82FF'],['上课打卡','每节课双方确认，时间币自动结算','#58CC02'],['互相评价','评分和交换次数公开，形成信用','#FFC800']];
  app.innerHTML=`
  <div class="hello">${mascot()}<div class="bubble"><h1>会了吗：用你会的，换你想学的</h1><p class="muted">面向想学新技能、自己也有一技之长的年轻人。把「报班」变成「交换」，把「一个人自学」变成「有人陪你学」。</p></div></div>
  <h2>用户痛点</h2>
  <div class="pain">
   <div class="box"><h3>报班太贵</h3><p class="muted">吉他、摄影一对一 200–500 元/小时，只是想试试也要花不少钱。</p></div>
   <div class="box"><h3>自学坚持不下去</h3><p class="muted">没人约时间、没人反馈，教程收藏了也不看。</p></div>
   <div class="box"><h3>会的没地方用</h3><p class="muted">擅长的技能不够开班，也找不到想学的人。</p></div>
   <div class="box"><h3>需求对不上</h3><p class="muted">我想学吉他，会吉他的人却不想学我的摄影，一对一交换很难成交。</p></div>
  </div>
  <h2>核心流程</h2>
  <div class="steps">${steps.map((s,i)=>`<div class="step"><div class="dot" style="background:${s[2]}">${i+1}</div><div><h3>${s[0]}</h3><p class="muted">${s[1]}</p></div></div>`).join('')}</div>
  <h2>关键机制</h2>
  <div class="mech">
   <div class="box"><h3>匹配度</h3><p class="muted">TA 能教我想学的 <code>+45</code>，我能教 TA 想学的 <code>+35</code>，两者都满足再 <code>+10</code>。同城或都能线上、空闲时间一致、评分高再加分。</p></div>
   <div class="box"><h3>时间币</h3><p class="muted">解决需求对不上。教 1 小时得 1 币，学 1 小时花 1 币，所有技能的 1 小时等价。新用户送 2 币，降低第一次尝试的门槛。</p></div>
   <div class="box"><h3>三人行</h3><p class="muted">取自「三人行，必有我师」。我教 A，A 教 B，B 教我。系统在「谁能教谁」的关系图里找三人闭环，让没有直接互补的人也能换成。</p></div>
   <div class="box"><h3>坚持机制</h3><p class="muted">连续学习天数、每周 3 节课目标、上海本周热门技能榜（一键加入想学，帮你发现更多能学的技能）。借鉴语言学习 App 的游戏化设计，解决「自学难坚持」。</p></div>
  </div>
  <h2>后续迭代</h2>
  <div class="box"><div class="tblwrap"><table><thead><tr><th>方向</th><th>功能</th><th>解决什么</th></tr></thead><tbody>
   <tr><td>信任</td><td>技能认证（作品集、证书）、爽约扣信用分</td><td>担心对方水平和态度</td></tr>
   <tr><td>坚持</td><td>学习小组、阶段作品展示、课后小测「会了吗？」</td><td>学了不练、不知道学会没有</td></tr>
   <tr><td>变现</td><td>时间币兑换付费课、高水平用户开收费课</td><td>擅长的人缺少变现渠道</td></tr>
   <tr><td>社区</td><td>同城技能市集、线下工作坊</td><td>线上交换很难建立长期关系</td></tr>
  </tbody></table></div></div>
  <p class="foot">这是可交互原型。示例用户是虚构的，你的技能卡、交换记录和时间币只保存在当前浏览器里。</p>`;
}

/* ---------- 路由 ---------- */
let tt;function toast(m,bad){clearTimeout(tt);document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.setAttribute('role','status');el.textContent=m;document.body.appendChild(el);tt=setTimeout(()=>el.remove(),2400)}
function route(){
  const h=(location.hash||'#discover').slice(1);
  const views={discover:vDiscover,post:vPost,swaps:vSwaps,about:vAbout,trio:vTrio,hot:vHot};
  const key=views[h]?h:'discover';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+(key==='trio'||key==='hot'?'discover':key)));
  closeL();views[key]();renderRail();window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
